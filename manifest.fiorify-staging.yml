---
applications:
  - name: fiorify-staging
    routes:
      - route: fiorify-staging.cfapps.eu30.hana.ondemand.com
    memory: 512M
    disk_quota: 2048M
    buildpacks:
      - nodejs_buildpack
    command: node backend/src/server.js
    health-check-type: http
    health-check-http-endpoint: /api/v1/health/liveness
    health-check-timeout: 60
    health-check-invocation-timeout: 10
    env:
      NODE_ENV: production
      FIORIFY_PERSISTENCE: postgres
      FIORIFY_ALLOW_POSTGRES_IN_PRODUCTION: "true"
      FIORIFY_ALLOW_DEMO_AUTH: "true"
      FIORIFY_STAGING_AUTH_OPT_IN: "true"
      FIORIFY_ENFORCE_AUTH: "true"
      SAP_DESTINATION_NAME: S21_FIORI
      SAP_CLIENT: "200"
      SAP_TIMEOUT_MS: "15000"
      Fiorify_JWT_SECRET: "931c82a7501c486fe826191267a44270fb1e228365cd25b473f2a05e992d6a4a"
      FIORIFY_JWT_SECRET: "931c82a7501c486fe826191267a44270fb1e228365cd25b473f2a05e992d6a4a"
      FIORIFY_SIGNING_SECRET: "eacb384d6bc4cfe4572a4f50144b7fb431d042602e4a54b6128e0fd3a1db76d4"
      MCP_ENABLED: "true"
      MCP_AUTO_CONNECT: "true"
      MCP_RECONNECT_MAX_ATTEMPTS: "10"
    services:
      - Fiorify-destination
      - Fiorify-connectivity
      - Fiorify-xsuaa
      - Fiorify-postgres-ups

---
applications:
  - name: fiorix-platform
    memory: 1024M
    disk_quota: 2048M
    buildpacks:
      - nodejs_buildpack
    command: node backend/src/server.js
    env:
      NODE_ENV: production
      FIORIX_PERSISTENCE: postgres
      FIORIX_ENFORCE_AUTH: "true"
      SAP_DESTINATION_NAME: S21
      SAP_CLIENT: "200"
      SAP_TIMEOUT_MS: "15000"
    services:
      - fiorix-destination
      - fiorix-connectivity
      - fiorix-xsuaa
      - fiorix-postgres

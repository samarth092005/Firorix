---
applications:
  - name: Fiorify-platform
    memory: 1024M
    disk_quota: 2048M
    buildpacks:
      - nodejs_buildpack
    command: node backend/src/server.js
    env:
      NODE_ENV: production
      FIORIFY_PERSISTENCE: hana
      FIORIFY_ENFORCE_AUTH: "true"
      SAP_DESTINATION_NAME: S21_FIORI
      SAP_CLIENT: "200"
      SAP_TIMEOUT_MS: "15000"
      MCP_ENABLED: "true"
      MCP_AUTO_CONNECT: "true"
    services:
      - Fiorify-destination
      - Fiorify-connectivity
      - Fiorify-xsuaa
      - Fiorify-hana

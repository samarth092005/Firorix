<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background rounded squircle gradient (Deep Blue to Sapphire) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B6CE5" />
      <stop offset="50%" stop-color="#0E44B7" />
      <stop offset="100%" stop-color="#082A82" />
    </linearGradient>

    <!-- Top floating layer gradient (Vibrant Cyan / Light Sky Blue) -->
    <linearGradient id="cyanLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CD6FD" />
      <stop offset="100%" stop-color="#38A2F8" />
    </linearGradient>

    <!-- Flowing stylized F white ribbon gradient -->
    <linearGradient id="fRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F0F7FF" />
      <stop offset="100%" stop-color="#C5E5FF" />
    </linearGradient>

    <!-- Accent electric blue glow -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0047BA" />
    </linearGradient>
  </defs>

  <!-- Offset Cyan shadow/backdrop shape -->
  <rect x="5" y="4" width="30" height="30" rx="9" fill="url(#cyanLayer)" opacity="0.85" />

  <!-- Main Dark Blue Rounded Base -->
  <rect x="9" y="8" width="34" height="34" rx="10" fill="url(#bgGrad)" />

  <!-- Stylized Flowing "F" Letterform -->
  <!-- Vertical dynamic stem curve -->
  <path d="M19 14.5C21 14.5 28 14.5 33 14.5C34.5 14.5 35 15.8 33.8 16.8L31.5 18.8C30.8 19.4 29.8 19.8 28.8 19.8H23.5L22.2 24.2H29C30.2 24.2 30.8 25.2 29.8 26.1L28 27.8C27.4 28.3 26.5 28.6 25.6 28.6H21L17.5 37C17 38.2 15.5 38.5 14.8 37.5C14.2 36.6 14.5 35.5 15.2 34.2L20.8 21.2C21.4 19.8 21 18.2 19.8 17.5C18.8 16.8 17.8 17.2 17.2 18.2L16.2 20C15.6 21 14.2 20.8 14.4 19.6C14.8 16.8 16.8 14.5 19 14.5Z" fill="url(#fRibbon)" />

  <!-- Lower energetic cyan splash wave inside F -->
  <path d="M16 32C17.5 28.5 19.5 26 22 25.5C20.5 28.5 19 32.5 17 35C16.2 36 15.2 35 15.4 34L16 32Z" fill="#38BDF8" opacity="0.9" />
</svg>
